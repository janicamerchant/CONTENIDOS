<section id="login" aria-labelledby="login-title">
 <p class="login-label">NIKA MEDIA / ESTUDIO</p>
 <h1 id="login-title">Tu próximo<br>contenido.</h1>
 <form id="login-form">
  <label>Email<input name="email" type="email" autocomplete="username" required></label>
  <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Entrar al Estudio</button>
 </form>
 <p id="login-status" role="status" aria-live="polite">Conectando…</p>
 <p class="login-note">Acceso para miembros del equipo. Si necesitas entrar, contacta al administrador.</p>
</section>
